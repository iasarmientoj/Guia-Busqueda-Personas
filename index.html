<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Búsqueda - MinJusticia</title>
    <!-- Fuentes y Estilos -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- Agregamos Marked para procesar el Markdown de las acciones -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="flex flex-col min-h-screen">

    <!-- Menú de Accesibilidad -->
    <div class="a11y-menu">
        <button onclick="toggleContrast()" class="a11y-btn" aria-label="Alto Contraste">
            <img src="icons8-contrast-50.png" class="w-6 h-6 flex-shrink-0" alt="Contraste">
            <span class="a11y-label">Contraste</span>
        </button>
        <button onclick="changeFontSize(-10)" class="a11y-btn" aria-label="Reducir Letra">
            <img src="icons8-decrease-font-64.png" class="w-6 h-6 flex-shrink-0" alt="Reducir">
            <span class="a11y-label">Reducir Letra</span>
        </button>
        <button onclick="changeFontSize(10)" class="a11y-btn" aria-label="Aumentar Letra">
            <img src="icons8-increase-font-64.png" class="w-6 h-6 flex-shrink-0" alt="Aumentar">
            <span class="a11y-label">Aumentar Letra</span>
        </button>
    </div>

    <!-- Pantalla de Carga -->
    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-gov-blue mb-4"></div>
        <p class="text-gov-blue font-bold text-lg">Cargando Guía Interactiva...</p>
        <p id="loaderStatus" class="text-sm text-gray-500 mt-2 font-mono">Conectando a Google Sheets...</p>
        <div id="errorMsg"
            class="hidden mt-4 text-center max-w-md p-4 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
        </div>
    </div>

    <!-- Header -->
    <header class="bg-gov-blue text-white py-4 shadow-md sticky top-0 z-40 transition-colors duration-300">
        <div class="container mx-auto px-4 flex items-center">
            <a href="https://www.gov.co/" target="_blank"
                class="mr-4 border-r border-blue-400 pr-4 flex items-center hover:opacity-90 transition-opacity">
                <img src="logoGovCO.png" alt="GOV.CO" class="h-8 md:h-9 w-auto">
            </a>
            <div class="text-sm font-light leading-tight">Guía de Búsqueda de Personas<br><span
                    class="font-bold">Ministerio de Justicia y del Derecho</span></div>
            <div id="lastUpdateDate" class="ml-auto text-sm font-light text-blue-100 hidden md:block"></div>
        </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <!-- Barra de Progreso -->
        <div id="progressContainer" class="mb-8 max-w-3xl mx-auto transition-opacity duration-300">
            <div class="flex justify-between text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">
                <div class="flex items-center cursor-pointer hover:text-gov-blue"
                    onclick="showTooltip(this, 'Estos datos nos ayudan a decirle a qué entidades específicas debe acudir según el caso.')">
                    Perfil
                    <svg class="w-3 h-3 ml-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
                <div class="flex items-center cursor-pointer hover:text-gov-blue"
                    onclick="showTooltip(this, 'Este dato es clave para determinar si la búsqueda debe ser Operativa o Investigativa.')">
                    Tiempo
                    <svg class="w-3 h-3 ml-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
                <div class="flex items-center cursor-pointer hover:text-gov-blue"
                    onclick="showTooltip(this, 'Esta información es necesaria para indicarle las entidades territoriales competentes que lo pueden ayudar.')">
                    Lugar
                    <svg class="w-3 h-3 ml-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
                <div class="flex items-center cursor-pointer hover:text-gov-blue"
                    onclick="showTooltip(this, 'La suposicion que se tenga sobre el caso define la ruta legal y humanitaria a seguir.')">
                    Situación
                    <svg class="w-3 h-3 ml-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
            </div>
            <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gov-blue transition-all duration-500 ease-out"
                    style="width: 10%"></div>
            </div>
            <!-- Cajita de ayuda navegación -->
            <div id="navHelpBox"
                class="hidden mt-3 bg-blue-50 text-gov-dark-blue p-3 rounded-md border border-blue-200 text-sm shadow-sm transition-all text-center">
            </div>
        </div>

        <!-- Contenedor de Vistas -->
        <div id="viewContainer"
            class="bg-white rounded-xl shadow-lg border border-gray-100 p-6 md:p-8 min-h-[400px] transition-colors duration-300">
            <!-- El contenido dinámico va aquí -->
        </div>

        <!-- Botones Extra Intro (Fuera del Panel) -->
        <div id="introExtraButtons" class="hidden mt-6 max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 px-2">
            <a href="https://www.unidadvictimas.gov.co/registro-unico-de-victimas-ruv/" target="_blank"
                class="bg-white border-2 border-gov-blue text-gov-blue hover:bg-gov-blue hover:text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-all flex items-center justify-between group text-left">
                <span>Conoce más información sobre las búsquedas en Colombia</span>
                <svg class="w-6 h-6 ml-3 flex-shrink-0 group-hover:translate-x-1 transition-transform" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                    </path>
                </svg>
            </a>
            <a href="https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=241736" target="_blank"
                class="bg-white border-2 border-gov-blue text-gov-blue hover:bg-gov-blue hover:text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-all flex items-center justify-between group text-left">
                <span>Información para mujeres buscadoras</span>
                <svg class="w-6 h-6 ml-3 flex-shrink-0 group-hover:translate-x-1 transition-transform" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                    </path>
                </svg>
            </a>
        </div>

        <!-- Botones Navegación -->
        <div class="mt-8 flex justify-between max-w-3xl mx-auto" id="navButtons">
            <button onclick="goBack()" id="backBtn"
                class="text-gov-blue font-bold hover:underline flex items-center px-4 py-2 invisible">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg> Atrás
            </button>
            <button id="nextBtn" onclick="goNext()"
                class="bg-gov-blue text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-gov-dark-blue hidden flex items-center transition-all">
                Continuar <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gov-blue py-3 mt-auto transition-colors duration-300">
        <div class="container mx-auto px-4 text-center">
            <p class="text-white font-medium text-sm">© Ministerio de Justicia y del Derecho</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
