<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Búsqueda - MinJusticia</title>
    <!-- Fuentes y Estilos -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- Agregamos Marked para procesar el Markdown de las acciones -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="flex flex-col min-h-screen">

    <!-- Menú de Accesibilidad -->
    <div class="a11y-menu">
        <button onclick="toggleContrast()" class="a11y-btn" aria-label="Alto Contraste">
            <img src="icons8-contrast-50.png" class="w-6 h-6 flex-shrink-0" alt="Contraste">
            <span class="a11y-label">Contraste</span>
        </button>
        <button onclick="changeFontSize(-10)" class="a11y-btn" aria-label="Reducir Letra">
            <img src="icons8-decrease-font-64.png" class="w-6 h-6 flex-shrink-0" alt="Reducir">
            <span class="a11y-label">Reducir Letra</span>
        </button>
        <button onclick="changeFontSize(10)" class="a11y-btn" aria-label="Aumentar Letra">
            <img src="icons8-increase-font-64.png" class="w-6 h-6 flex-shrink-0" alt="Aumentar">
            <span class="a11y-label">Aumentar Letra</span>
        </button>
    </div>

    <!-- Pantalla de Carga -->
    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-gov-blue mb-4"></div>
        <p class="text-gov-blue font-bold text-lg">Cargando Guía Interactiva...</p>
        <p id="loaderStatus" class="text-sm text-gray-500 mt-2 font-mono">Conectando a Google Sheets...</p>
        <div id="errorMsg"
            class="hidden mt-4 text-center max-w-md p-4 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
        </div>
    </div>

    <!-- Header -->
    <header class="bg-gov-blue text-white py-4 shadow-md sticky top-0 z-40 transition-colors duration-300">
        <div class="container mx-auto px-4 flex items-center">
            <a href="https://www.gov.co/" target="_blank"
                class="mr-4 border-r border-blue-400 pr-4 flex items-center hover:opacity-90 transition-opacity">
                <img src="logoGovCO.png" alt="GOV.CO" class="h-8 md:h-9 w-auto">
            </a>
            <div class="text-sm font-light leading-tight">Guía de Búsqueda de Personas<br><span
                    class="font-bold">Ministerio de Justicia y del Derecho</span></div>
            <div id="lastUpdateDate" class="ml-auto text-s font-light text-blue-100 hidden md:block"></div>
        </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <!-- Barra de Progreso -->
        <div id="progressContainer" class="mb-8 max-w-3xl mx-auto transition-opacity duration-300">
            <div class="flex justify-between text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">
                <span>Perfil</span><span>Tiempo</span><span>Lugar</span><span>Indicios</span>
            </div>
            <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gov-blue transition-all duration-500 ease-out"
                    style="width: 10%"></div>
            </div>
        </div>

        <!-- Contenedor de Vistas -->
        <div id="viewContainer"
            class="bg-white rounded-xl shadow-lg border border-gray-100 p-6 md:p-8 min-h-[400px] transition-colors duration-300">
            <!-- El contenido dinámico va aquí -->
        </div>

        <!-- Botones Navegación -->
        <div class="mt-8 flex justify-between max-w-3xl mx-auto" id="navButtons">
            <button onclick="goBack()" id="backBtn"
                class="text-gov-blue font-bold hover:underline flex items-center px-4 py-2 invisible">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg> Atrás
            </button>
            <button id="nextBtn" onclick="goNext()"
                class="bg-gov-blue text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-gov-dark-blue hidden flex items-center transition-all">
                Continuar <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gov-blue py-3 mt-auto transition-colors duration-300">
        <div class="container mx-auto px-4 text-center">
            <p class="text-white font-medium text-sm">© Ministerio de Justicia y del Derecho</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
